services:
  postgres:
    image: postgres:17-alpine
    command: postgres -c max_connections=500
    environment:
      POSTGRES_DB: pixel_snake
      POSTGRES_USER: pixel_snake
      POSTGRES_PASSWORD: pixel_snake_local
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - training_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pixel_snake -d pixel_snake']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  training_data:
